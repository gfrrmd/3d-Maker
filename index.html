<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Studio 3D Trace</title>
<style>
:root{--bg:#232323;--pn:#303030;--bd:#1a1a1a;--tx:#d9d9d9;--ac:#4772b3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px Inter,'Segoe UI',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#wrap{position:fixed;inset:0 0 auto 0;height:calc(100% - var(--ph,150px))}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs{display:flex;border-bottom:1px solid var(--bd)}
#tabs button{flex:1;padding:12px 4px;background:none;border:0;color:#9aa3b2;font-size:14px}
#tabs button.on{color:var(--tx);box-shadow:inset 0 -2px var(--ac)}
.pane{display:none;gap:8px;padding:10px;flex-wrap:wrap;overflow-y:auto;max-height:40vh;align-items:center;min-height:62px}
.pane.on{display:flex}
.pane>*{flex:0 0 auto}
.b{min-height:44px;padding:0 14px;border-radius:4px;border:1px solid #1a1a1a;background:#4a4a4a;color:var(--tx);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.b.on{background:var(--ac);border-color:var(--ac)}
.b.red{background:#6b3434}
select{height:36px;border-radius:4px;border:1px solid #1a1a1a;background:#4a4a4a;color:var(--tx);padding:0 8px;font-size:14px}
label.f{display:flex;flex-direction:column;font-size:11px;color:#9aa3b2;gap:2px}
input[type=number]{width:84px;height:36px;border-radius:4px;border:1px solid #1a1a1a;background:#1d1d1d;color:var(--tx);padding:0 8px;font-size:16px}
input[type=range]{width:110px}
input[type=color]{width:44px;height:44px;border:0;background:none;padding:0}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);background:#111e;padding:8px 14px;border-radius:4px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg)}
#hr{position:fixed;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;z-index:5}.b:disabled{opacity:.35}
.sec{flex:1 0 100%;font-size:11px;color:#9a9a9a;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
#num{flex:1 0 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}#num input{width:100%}
#p-prop{flex-wrap:wrap;max-height:36vh;overflow-y:auto;align-items:flex-end}#p-prop input[type=number],#p-prop select{width:120px}#p-prop input[type=checkbox]{width:26px;height:26px}#p-prop input[type=color]{width:60px;height:36px}
@media(min-width:900px){.pane{padding:12px 16px}}
</style>
<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
"three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.0/build/index.module.js",
"three-bvh-csg":"https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"}}
</script>
</head>
<body>
<div id="wrap"></div>
<div id="hr"><button class="b" id="undo" disabled>Undo</button><button class="b" id="redo" disabled>Redo</button></div>
<div id="toast"></div>
<div id="err">Gagal memuat Three.js. Periksa koneksi internet lalu muat ulang.</div>
<div id="ui">
 <div id="tabs">
  <button data-t="add" class="on">Tambah</button><button data-t="trace">Trace</button>
  <button data-t="prop">Properti</button><button data-t="edit">Edit</button><button data-t="mesh">Mesh</button><button data-t="file">File</button>
 </div>
 <div class="pane on" id="p-add">
  <button class="b" data-add="cube">Kubus</button><button class="b" data-add="sphere">Bola</button>
  <button class="b" data-add="cylinder">Silinder</button><button class="b" data-add="cone">Kerucut</button>
  <button class="b" data-add="torus">Torus</button><button class="b" data-add="plane">Bidang</button><button class="b" data-jx="cross">Perempatan</button><button class="b" data-jx="tee">Pertigaan T</button><button class="b" data-jx="y">Pertigaan Y</button>
 </div>
 <div class="pane" id="p-trace">
  <label class="b" style="cursor:pointer">Impor gambar<input id="img" type="file" accept="image/*" hidden></label>
  <label class="f">Lebar gambar (m)<input id="imgW" type="number" value="100" min="1" step="1" inputmode="decimal"></label>
  <label class="f">Opasitas<input id="imgO" type="range" min="0.1" max="1" step="0.05" value="0.7"></label>
  <button class="b" id="imgDel">Hapus gambar</button>
  <button class="b" id="topv">Tampak atas</button>
  <select id="trType" aria-label="Jenis trace"><option value="bld">Bangunan</option><option value="road">Jalan</option></select>
  <button class="b" id="trOn">Mulai trace</button>
  <button class="b" id="trUndo">Hapus titik</button><button class="b" id="trSnap">Snap 0.5 m</button>
  <label class="f">Jumlah lantai<input id="trH" type="number" value="8" min="1" step="1" inputmode="decimal"></label>
  <button class="b" id="trGo">Buat bangunan</button>
  <button class="b" id="roadGo">Buat jalan</button>
  <button class="b red" id="trCancel">Batal</button>
 </div>
 <div class="pane" id="p-prop"></div>
 <div class="pane" id="p-edit">
  <button class="b on" data-m="translate">Pindah</button><button class="b" data-m="rotate">Putar</button>
  <button class="b" data-m="scale">Skala</button><button class="b" id="snap">Snap</button>
  <input id="col" type="color" value="#cccccc" aria-label="Warna">
  <button class="b" id="dup">Duplikat</button><button class="b" id="wire">Wireframe</button>
  <button class="b red" id="del">Hapus</button><button class="b" id="focus">Fokus</button>
  <div id="num"></div>
 </div>
 <div class="pane" id="p-mesh">
  <span class="sec">Seleksi, grup, boolean</span>
  <button class="b" id="multi">Multi-pilih</button><button class="b" id="grp">Grupkan</button><button class="b" id="ungrp">Pisah grup</button>
  <button class="b" id="bSub">Kurangi A−B</button><button class="b" id="bAdd">Gabung A+B</button><button class="b" id="bInt">Irisan A∩B</button>
  <span class="sec">Edit mesh</span>
  <button class="b" id="editB">Edit Mode</button>
  <button class="b on" data-em="v">Titik</button><button class="b" data-em="e">Rusuk</button><button class="b" data-em="f">Sisi</button>
  <button class="b" id="selAll">Pilih semua</button><button class="b" id="subd">Bagi mesh</button>
  <span class="sec">Modeling (Edit Mode)</span>
  <button class="b on" data-m="translate">Pindah</button><button class="b" data-m="rotate">Putar</button><button class="b" data-m="scale">Skala</button>
  <label class="f">Jarak extrude<input id="exD" type="number" value="1" step="0.5" inputmode="decimal"></label>
  <button class="b" id="exE">Extrude sisi</button><button class="b red" id="exX">Hapus pilihan</button>
  <label class="f">Sumbu potong<select id="cA"><option>x</option><option>y</option><option>z</option></select></label>
  <label class="f">Posisi (%)<input id="cP" type="number" value="50" min="0" max="100" step="1" inputmode="numeric"></label>
  <button class="b" id="cutGo">Loop cut</button><button class="b" id="mirGo">Cermin</button>
  <label class="f">Inset (%)<input id="inP" type="number" value="20" min="2" max="95" step="5" inputmode="numeric"></label>
  <button class="b" id="inGo">Inset sisi</button>
  <label class="f">Toleransi gabung<input id="wT" type="number" value="0.01" min="0.0001" step="0.01" inputmode="decimal"></label>
  <button class="b" id="wGo">Gabung titik</button><button class="b" id="flGo">Balik normal</button><button class="b" id="orgGo">Pusatkan origin</button>
  <span class="sec">Array (duplikasi berulang objek terpilih)</span>
  <label class="f">Jumlah<input id="aN" type="number" value="3" min="2" max="50" step="1" inputmode="numeric"></label>
  <label class="f">Jarak X (m)<input id="aX" type="number" value="10" step="1" inputmode="decimal"></label>
  <label class="f">Jarak Y (m)<input id="aY" type="number" value="0" step="1" inputmode="decimal"></label>
  <label class="f">Jarak Z (m)<input id="aZ" type="number" value="0" step="1" inputmode="decimal"></label>
  <button class="b" id="arrGo">Buat array</button>
  <span class="sec">Lengkung</span>
  <label class="f">Sudut (deg)<input id="bA" type="number" value="90" step="5" inputmode="decimal"></label>
  <label class="f">Sumbu panjang<select id="bL"><option>x</option><option>y</option><option>z</option></select></label>
  <label class="f">Arah lengkung<select id="bB"><option>x</option><option selected>y</option><option>z</option></select></label>
  <label class="f">Detail<input id="bD" type="number" value="16" min="4" max="32" step="1" inputmode="numeric"></label>
  <button class="b" id="bendGo">Lengkungkan</button>
 </div>
 <div class="pane" id="p-file">
  <button class="b" id="exp">Ekspor .glb</button><button class="b" id="expObj">Ekspor .obj</button><button class="b" id="expStl">Ekspor .stl</button><button class="b" id="expPng">Ekspor .png</button><button class="b" id="saveJ">Simpan proyek</button><label class="b" style="cursor:pointer">Buka proyek<input id="openJ" type="file" accept=".json,application/json" hidden></label><label class="b" style="cursor:pointer">Impor .glb<input id="impG" type="file" accept=".glb,.gltf" hidden></label><button class="b red" id="newP">Proyek baru</button><button class="b" id="grid">Grid</button>
  <button class="b" id="home">Reset kamera</button>
 </div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {TransformControls} from 'three/addons/controls/TransformControls.js';
import {mergeGeometries,mergeVertices,toCreasedNormals} from 'three/addons/utils/BufferGeometryUtils.js';
import {TessellateModifier} from 'three/addons/modifiers/TessellateModifier.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OBJExporter} from 'three/addons/exporters/OBJExporter.js';
import {STLExporter} from 'three/addons/exporters/STLExporter.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const wrap=$('#wrap'), toastEl=$('#toast');
let tt; const toast=m=>{toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('on'),1800)};

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
wrap.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x3d3d3d);
const camera=new THREE.PerspectiveCamera(50,1,0.1,5000);
const HOME=()=>{camera.position.set(60,50,80);controls.target.set(0,0,0);controls.update()};
scene.add(new THREE.HemisphereLight(0xffffff,0x404050,1.0));
const sun=new THREE.DirectionalLight(0xffffff,2); sun.position.set(80,150,60); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-150,right:150,top:150,bottom:-150,near:1,far:500});
scene.add(sun);
const gridH=new THREE.GridHelper(400,80,0x6b6b6b,0x4a4a4a); scene.add(gridH);
const objs=new THREE.Group(); scene.add(objs);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.499; controls.maxDistance=2000;
HOME();
const tc=new TransformControls(camera,renderer.domElement); scene.add(tc);
let blockUntil=0, before=null;
const snapT=o=>({p:o.position.clone(),q:o.quaternion.clone(),s:o.scale.clone()});
const applyT=(o,t)=>{o.position.copy(t.p);o.quaternion.copy(t.q);o.scale.copy(t.s)};
tc.addEventListener('dragging-changed',e=>{controls.enabled=!e.value;if(editMesh){editDrag(e.value);return}const o=tc.object;
  if(e.value){before=o?snapT(o):null}
  else{blockUntil=performance.now()+150;
    if(o&&before){const a=before,b=snapT(o);before=null;push(()=>applyT(o,a),()=>applyT(o,b))}}});
// History (undo/redo)
const hist=[]; let hi=0;
function ui(){$('#undo').disabled=hi<1;$('#redo').disabled=hi>=hist.length;save();syncNum()}
function push(u,r){hist.length=hi;hist.push({u,r});hi=hist.length;ui()}
function undo(){if(hi>0){hist[--hi].u();ui()}else toast('Tidak ada yang di-undo')}
function redo(){if(hi<hist.length){hist[hi++].r();ui()}}
$('#undo').onclick=undo;$('#redo').onclick=redo;

function resize(){
  const ph=$('#ui').offsetHeight; document.documentElement.style.setProperty('--ph',ph+'px');
  const w=wrap.clientWidth,h=wrap.clientHeight; if(!w||!h)return;
  renderer.setSize(w,h,true); camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,200));
new ResizeObserver(resize).observe($('#ui')); resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});

// Tabs
function showTab(t){$$('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));$$('.pane').forEach(q=>q.classList.toggle('on',q.id==='p-'+t))}
$$('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));

// Objects
let sel=null,picks=[];
const mat=c=>new THREE.MeshStandardMaterial({color:c||0xcccccc,roughness:.6,metalness:.05,side:THREE.DoubleSide});
function drop(m){picks=picks.filter(c=>c!==m);if(sel===m)select(null);objs.remove(m);buildPanel()}
function addMesh(m){m.castShadow=m.receiveShadow=true;objs.add(m);select(m);
  push(()=>drop(m),()=>{objs.add(m);select(m)});return m}
const GEO={
  cube:()=>new THREE.BoxGeometry(10,10,10), sphere:()=>new THREE.SphereGeometry(5,48,32),
  cylinder:()=>new THREE.CylinderGeometry(5,5,10,48), cone:()=>new THREE.ConeGeometry(5,10,48),
  torus:()=>new THREE.TorusGeometry(5,1.6,24,64), plane:()=>new THREE.PlaneGeometry(10,10).rotateX(-Math.PI/2)};
$$('[data-add]').forEach(b=>b.onclick=()=>{
  const g=GEO[b.dataset.add](); const m=new THREE.Mesh(g,mat()); m.userData.prim=b.dataset.add;
  g.computeBoundingBox(); m.position.set(controls.target.x,-g.boundingBox.min.y,controls.target.z);
  addMesh(m); toast('Ditambahkan');
});
const meshesOf=o=>{const a=[];o.traverse(c=>{if(c.isMesh)a.push(c)});return a};
const mainOf=o=>o.isMesh?o:(o.userData.main||meshesOf(o)[0]);
const glow=(o,h)=>meshesOf(o).forEach(m=>m.material.emissive&&m.material.emissive.setHex(h));
function select(o){
  if(editMesh){if(o===editMesh)return;exitEdit()}
  picks.forEach(c=>glow(c,0));picks=o?[o]:[];
  sel=o;
  if(o){glow(o,0x3a1f00);tc.attach(o);{const mm=mainOf(o);if(mm&&mm.material&&mm.material.color)$('#col').value='#'+mm.material.color.getHexString()}}else tc.detach();
  buildPanel();syncNum();
}
$$('[data-m]').forEach(b=>b.onclick=()=>{tc.setMode(b.dataset.m);$$('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});
let snapOn=false;
$('#snap').onclick=e=>{snapOn=!snapOn;e.currentTarget.classList.toggle('on',snapOn);
  tc.setTranslationSnap(snapOn?1:null);tc.setRotationSnap(snapOn?Math.PI/12:null);tc.setScaleSnap(snapOn?.1:null)};
let colOld=null;
$('#col').oninput=e=>{if(!sel)return;const k=sel.userData.kind;
  if(k){const q=sel.userData.params;if(!colOld)colOld={o:sel,j:JSON.stringify(q)};q[COLKEY[k]]=e.target.value;rebuild(sel);buildPanel()}
  else{const m=mainOf(sel).material;if(!m||!m.color)return;if(!colOld)colOld={m,c:m.color.clone()};m.color.set(e.target.value)}};
$('#col').onchange=()=>{if(!colOld)return;const c=colOld;colOld=null;
  if(c.j)commitParams(c.o,c.j);else{const m=c.m,n=m.color.clone();push(()=>m.color.copy(c.c),()=>m.color.copy(n))}};
$('#dup').onclick=()=>{if(!sel)return toast('Pilih objek dulu');exitEdit();let c;
  if(sel.userData.kind){c=makeParam(sel.userData.kind,JSON.parse(JSON.stringify(sel.userData.params)));c.position.copy(sel.position);c.quaternion.copy(sel.quaternion);c.scale.copy(sel.scale)}
  else{c=sel.clone();if(sel.material)c.material=sel.material.clone()}
  c.position.x+=3;c.position.z+=3;addMesh(c)};
$('#wire').onclick=()=>{if(!sel)return toast('Pilih objek dulu');const ms=meshesOf(sel),f=()=>ms.forEach(m=>{m.material.wireframe=!m.material.wireframe});f();push(f,f)};
$('#del').onclick=()=>{if(!sel)return toast('Pilih objek dulu');
  const o=sel; drop(o); push(()=>{objs.add(o);select(o)},()=>drop(o))};

// Picking (tap, bukan drag)
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), el=renderer.domElement;
let down=null;
let dragIdx=-1;
function groundAt(e,out){const r=el.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),out)}
el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now(),n:1};
  if(tracing&&pts.length){const r=el.getBoundingClientRect();let best=28;dragIdx=-1;
    pts.forEach((p,i)=>{const v=p.clone().project(camera);
      const d=Math.hypot((v.x+1)/2*r.width+r.left-e.clientX,(1-v.y)/2*r.height+r.top-e.clientY);
      if(d<best){best=d;dragIdx=i}});
    if(dragIdx>=0)controls.enabled=false}});
el.addEventListener('pointermove',e=>{if(dragIdx<0)return;const p=new THREE.Vector3();if(groundAt(e,p)){pts[dragIdx].copy(sp(p));redraw()}});
el.addEventListener('pointercancel',()=>{if(dragIdx>=0){dragIdx=-1;controls.enabled=true}down=null});
el.addEventListener('pointerup',e=>{
  if(dragIdx>=0){dragIdx=-1;controls.enabled=true;down=null;return}
  if(!down||tc.dragging||performance.now()<blockUntil){down=null;return}
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null;
  if(moved>8)return;
  const r=el.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  if(tracing){
    const p=new THREE.Vector3();
    if(ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),p)){addPoint(sp(p))}
    return;
  }
  if(editMesh){editPick(ray.intersectObject(editMesh,false)[0]);return}
  const hit=ray.intersectObjects(objs.children,true)[0];
  let t=hit&&hit.object; while(t&&t.parent!==objs)t=t.parent;
  if(multiMode&&t){togglePick(t);return}
  select(t||null); if(t&&t.userData.kind)showTab('prop');
});

// Reference image
let ref=null;
$('#img').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const url=URL.createObjectURL(f);
  new THREE.TextureLoader().load(url,t=>{
    t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=renderer.capabilities.getMaxAnisotropy();
    clearRef();
    const a=t.image.width/t.image.height, W=100;
    const g=new THREE.PlaneGeometry(W,W/a).rotateX(-Math.PI/2);
    ref=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:+$('#imgO').value,depthWrite:false}));
    ref.position.y=0.02; ref.renderOrder=-1; scene.add(ref);
    applyW(); topView(); toast('Gambar dimuat. Atur lebar (m) sesuai skala nyata.');
    URL.revokeObjectURL(url);
  },undefined,()=>toast('Gambar gagal dimuat'));
  e.target.value='';
};
function clearRef(){if(!ref)return;scene.remove(ref);ref.material.map.dispose();ref.material.dispose();ref.geometry.dispose();ref=null}
function applyW(){if(ref){const s=Math.max(1,+$('#imgW').value||100)/100;ref.scale.set(s,1,s)}}
$('#imgW').oninput=applyW;
$('#imgO').oninput=e=>{if(ref)ref.material.opacity=+e.target.value};
$('#imgDel').onclick=clearRef;
function topView(){controls.target.set(0,0,0);camera.position.set(0,Math.max(120,(+$('#imgW').value||100)*1.1),0.01);controls.update()}
$('#topv').onclick=topView;

// Trace
let tracing=false, pts=[]; const tg=new THREE.Group(); scene.add(tg);
let line=null;
function redraw(){
  tg.children.slice().forEach(c=>{tg.remove(c);c.geometry?.dispose();c.material?.dispose()});
  pts.forEach((p,i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(Math.max(.4,camera.position.length()*.008),12,8),
    new THREE.MeshBasicMaterial({color:i?0xffcc33:0x33ff99,depthTest:false}));m.position.copy(p);m.renderOrder=10;tg.add(m)});
  if(pts.length>1){const l=new ($('#trType').value==='road'?THREE.Line:THREE.LineLoop)(new THREE.BufferGeometry().setFromPoints(pts.map(p=>p.clone().setY(.05))),

  const seen=new Map(),I=[];
  for(let t=0;t<idx.length;t+=3){const k=[idx[t],idx[t+1],idx[t+2]].sort((a,b)=>a-b).join('_');
    if(!seen.has(k))seen.set(k,[]);seen.get(k).push(t)}
  const drop=new Set();seen.forEach(l=>{if(l.length>=2){drop.add(l[0]);drop.add(l[1])}});
  for(let t=0;t<idx.length;t+=3)if(!drop.has(t))I.push(idx[t],idx[t+1],idx[t+2]);
  return geoRemove(pos,I,new Set(),'f')}
function geoMirror(pos,idx,axis,c,tol){
  const n=pos.length/3,P=pos.slice(),I=idx.slice();
  for(let v=0;v<n;v++)for(let j=0;j<3;j++)P.push(j===axis?2*c-pos[v*3+j]:pos[v*3+j]);
  for(let t=0;t<idx.length;t+=3)I.push(idx[t]+n,idx[t+2]+n,idx[t+1]+n);
  const w=geoWeld(P,I,tol);return geoDropPairs(w.pos,w.idx)}
function geoFlip(idx,sel){
  const I=idx.slice();
  for(let t=0;t<I.length;t+=3)if(!sel.size||(sel.has(I[t])&&sel.has(I[t+1])&&sel.has(I[t+2]))){const x=I[t+1];I[t+1]=I[t+2];I[t+2]=x}
  return {pos:null,idx:I}}

const pI=()=>[arr(editGeo.attributes.position.array),arr(editGeo.index.array)];
const ensureEdit=()=>{if(!editMesh)enterEdit();return !!editMesh};
function axRange(ax){const p=editGeo.attributes.position;let lo=1e18,hi=-1e18;for(let i=0;i<p.count;i++){const v=p.array[i*3+ax];if(v<lo)lo=v;if(v>hi)hi=v}return [lo,hi]}
$('#inGo').onclick=()=>{if(!editMesh)return toast('Masuk Edit Mode, mode Sisi, pilih sisi');
  const [p,i]=pI(),r=geoInset(p,i,eSel,Math.min(.95,Math.max(.02,(+$('#inP').value||20)/100)));
  if(!r)return toast('Pilih sisi dulu (mode Sisi)');editReplace(r,r.newVerts);toast('Inset jadi. Tarik dengan Extrude untuk tonjolan')};
$('#mirGo').onclick=()=>{if(!ensureEdit())return;const ax=rI[$('#cA').value],[lo,hi]=axRange(ax);
  if(hi-lo<1e-6)return toast('Mesh terlalu tipis di sumbu ini');
  const f=Math.min(100,Math.max(0,+$('#cP').value))/100,[p,i]=pI();
  editReplace(geoMirror(p,i,ax,lo+(hi-lo)*f,Math.max(1e-4,(hi-lo)*1e-4)),[]);toast('Dicermin. 100% = cermin di sisi terjauh')};
$('#wGo').onclick=()=>{if(!ensureEdit())return;const [p,i]=pI(),r=geoWeld(p,i,Math.max(1e-4,+$('#wT').value||.01));
  if(!r.idx.length)return toast('Toleransi terlalu besar');editReplace(r,[]);toast('Titik berdekatan digabung')};
$('#flGo').onclick=()=>{if(!ensureEdit())return;const [p,i]=pI(),r=geoFlip(i,eSel);r.pos=p;editReplace(r,[...eSel]);toast('Normal dibalik')};
$('#orgGo').onclick=()=>{const m=sel;if(!eligible(m))return toast('Pilih mesh biasa');exitEdit();
  const old=m.geometry,g=old.clone();g.computeBoundingBox();const c=g.boundingBox.getCenter(new THREE.Vector3());g.translate(-c.x,-c.y,-c.z);
  const p0=m.position.clone(),p1=p0.clone().add(c.clone().multiply(m.scale).applyQuaternion(m.quaternion));
  m.geometry=g;m.position.copy(p1);m.userData.custom=1;
  push(()=>{m.geometry=old;m.position.copy(p0)},()=>{m.geometry=g;m.position.copy(p1)});toast('Origin dipusatkan')};
function cloneObj(o){let c;
  if(o.userData.kind){c=makeParam(o.userData.kind,JSON.parse(JSON.stringify(o.userData.params)));c.position.copy(o.position);c.quaternion.copy(o.quaternion);c.scale.copy(o.scale)}
  else{c=o.clone();if(o.material)c.material=o.material.clone()}
  return c}
$('#arrGo').onclick=()=>{const o=sel;if(!o)return toast('Pilih objek dulu');exitEdit();
  const n=Math.min(50,Math.max(2,Math.round(+$('#aN').value||3))),off=new THREE.Vector3(+$('#aX').value||0,+$('#aY').value||0,+$('#aZ').value||0),cs=[];
  for(let k=1;k<n;k++){const c=cloneObj(o);c.position.addScaledVector(off,k);c.castShadow=c.receiveShadow=true;objs.add(c);cs.push(c)}
  select(cs[cs.length-1]);
  push(()=>cs.forEach(c=>drop(c)),()=>{cs.forEach(c=>objs.add(c));select(cs[cs.length-1])});toast('Array dibuat: '+n+' objek')};
buildPanel();syncNum();
try{const j=localStorage.getItem('st3d');if(j){loadProject(JSON.parse(j));toast('Proyek terakhir dimuat')}}catch(e){}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(e.key==='g')tc.setMode('translate');if(e.key==='r')tc.setMode('rotate');if(e.key==='s')tc.setMode('scale');
  if(e.key==='Delete'||e.key==='x')$('#del').click()});
</script>
